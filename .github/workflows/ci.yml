name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Verify Hufolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build example site
        run: |
          hugo --themesDir ../.. -s exampleSite --gc --minify --printPathWarnings

      - name: Validate HTML Contract & Budget
        run: |
          chmod +x .github/scripts/validate.sh
          .github/scripts/validate.sh

      - name: Check internal links and asset integrity
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress exampleSite/public
          fail: true
