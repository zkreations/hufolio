# hugo server --themesDir ../..

title = "Hufolio"
theme = "hufolio"
baseURL = "https://hufolio.zkreations.com/"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  baseName = "llms-full"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "llms", "llmsfull"]

[menus]
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 1

[params]
  description = "A minimalist editorial site built with Hufolio."
  author = "zkreations"
  author_role = "Designer & Developer"
  author_bio = "Posts and reflections to organize ideas. Keeping the essentials, whether short or long."
  date_format = "02 Jan 2006"
  home_posts_limit = 8
  show_reading_time = true
  footer_text = "All rights reserved."
  cover_wide = true
  telegram_channel = "@zkreations"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/zkreations/hufolio"
