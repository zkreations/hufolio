{{- $dest := .Destination -}}
{{- $image := .Page.Resources.GetMatch $dest -}}
{{- if not $image -}}
  {{- $image = resources.Get $dest -}}
{{- end -}}
<figure class="article-figure">
  {{- if $image -}}
    {{- $contentImg := $image -}}
    {{- if and (ne $image.MediaType.SubType "svg") (ne $image.MediaType.SubType "gif") (gt $image.Width 1400) -}}
      {{- $contentImg = $image.Resize "1400x webp" -}}
    {{- end -}}
    <img src="{{ $contentImg.RelPermalink }}" alt="{{ .Text }}" width="{{ $contentImg.Width }}" height="{{ $contentImg.Height }}" loading="lazy" decoding="async">
  {{- else -}}
    <img src="{{ $dest | safeURL }}" alt="{{ .Text }}"{{ with .Attributes.width }} width="{{ . }}"{{ end }}{{ with .Attributes.height }} height="{{ . }}"{{ end }} loading="lazy" decoding="async">
  {{- end -}}
  {{- with .Title -}}
    <figcaption>{{ . }}</figcaption>
  {{- end -}}
</figure>
