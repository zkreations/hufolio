{{- $dest := .Destination -}}
{{- $image := .Page.Resources.GetMatch $dest -}}
{{- if not $image -}}
  {{- $image = resources.Get $dest -}}
{{- end -}}
<figure class="article-figure">
  {{- if $image -}}
    <img src="{{ $image.RelPermalink }}" alt="{{ .Text }}" width="{{ $image.Width }}" height="{{ $image.Height }}" loading="lazy" decoding="async">
  {{- else -}}
    <img src="{{ $dest | safeURL }}" alt="{{ .Text }}" loading="lazy" decoding="async">
  {{- end -}}
  {{- with .Title -}}
    <figcaption>{{ . }}</figcaption>
  {{- end -}}
</figure>
