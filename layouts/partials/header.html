<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    {{ with site.Menus.main }}
      <nav class="site-nav">
        {{ range . }}
          <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    {{ end }}
  </div>
</header>
